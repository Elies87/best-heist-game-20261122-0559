<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Night Ledger — a museum heist</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090f; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #game {
    width: min(100vw, 177.78vh);
    aspect-ratio: 16 / 9;
    display: block;
    background: #0d1017;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
    touch-action: none;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="The Night Ledger: a top-down museum heist. Move with WASD, sneak with Shift, hold E to take loot and pick locks, Q for an EMP burst, F or click to toss a coin."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
